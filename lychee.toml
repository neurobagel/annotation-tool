# lychee.toml

# Exclude these directories from being checked
exclude_path = [
    "node_modules",
    "dist",
    "coverage"
]

# Exclude URLs matching these regex patterns
exclude = [
    # Localhost and local development
    '^http://localhost',
    
    # Template literal variables in source code (e.g., ${configName} or $%7BconfigName%7D)
    '\$\{.*\}',
    '\$%7B.*%7D',
    
    # Mock domains used in tests
    'https?://(www\.)?example\.com',
    
    # Non-resolvable or automated bot links
    'neurobagel-bot\[bot\]',
    
    # Mock Neurobagel APIs, endpoints, and template literals used in constants/mocks
    'http://neurobagel\.org/vocab/',
    'http://ncithesaurus\.nci\.nih\.gov/',
    'http://snomed\.info/sct/',
    'https://raw\.githubusercontent\.com/neurobagel/communities/main/configs/New',
    'https://raw\.githubusercontent\.com/neurobagel/communities/main/configs/$'
]
